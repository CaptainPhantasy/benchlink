{
  "name": "Benchlink PR verification",
  "on": {
    "pull_request": {
      "types": [
        "opened",
        "synchronize",
        "reopened",
        "ready_for_review"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-pr-${{ github.event.pull_request.number }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Checkout untrusted PR code without retained credentials",
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false,
            "fetch-depth": 1
          }
        },
        {
          "name": "Python 3.13",
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.13"
          }
        },
        {
          "name": "Node 22",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Explicit runtime, test, build and browser dependencies",
          "run": "python -m pip install -r requirements-dev.lock setuptools==84.2.1 wheel==0.48.0 build==1.6.1 pyproject_hooks==1.3.3 playwright==1.64.1 pillow==13.0.0\npython -m pip download --only-binary=:all: -r requirements.lock -d \"$RUNNER_TEMP/benchlink-wheelhouse\"\npython -m playwright install --with-deps chromium"
        },
        {
          "name": "Full pytest including mandatory wheels/sdist, security and Chromium",
          "run": "python tools/testing/run_local.py --wheelhouse \"$RUNNER_TEMP/benchlink-wheelhouse\" python -m pytest -q"
        },
        {
          "name": "Synthetic roundtrip smoke",
          "run": "python tools/testing/run_local.py --wheelhouse \"$RUNNER_TEMP/benchlink-wheelhouse\" python tools/smoke/smoke_roundtrip.py"
        },
        {
          "name": "Synthetic daemon smoke",
          "run": "python tools/testing/run_local.py --wheelhouse \"$RUNNER_TEMP/benchlink-wheelhouse\" python apps/bridge-daemon/smoke_daemon.py"
        },
        {
          "name": "Synthetic sidecar smoke",
          "run": "python tools/testing/run_local.py --wheelhouse \"$RUNNER_TEMP/benchlink-wheelhouse\" python apps/mac-sidecar/smoke_sidecar.py"
        },
        {
          "name": "Evaluated HTML Node syntax",
          "run": "python tools/testing/run_local.py --wheelhouse \"$RUNNER_TEMP/benchlink-wheelhouse\" python tools/testing/check_node.py"
        }
      ]
    }
  }
}
